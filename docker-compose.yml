services:
  postgres:
    image: postgres:16-alpine
    container_name: trainingapp-db
    environment:
      POSTGRES_USER: trainingapp
      POSTGRES_PASSWORD: trainingapp_dev
      POSTGRES_DB: trainingapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainingapp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
